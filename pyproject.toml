[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opoise"
dynamic = ["version"]
description = "Convex portfolio construction engine on cvxpy: risk objectives, constraints, diagnostics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["cvxpy>=1.9,<2", "clarabel>=0.11", "numpy>=2.0", "scipy>=1.13", "pydantic>=2.10,<3", "pyyaml>=6.0"]

[project.optional-dependencies]
# Commercial solver (MOSEK), licensed by the user: deliberately outside the licence
# allowlist and the constraint pins, which cover the default install only.
mosek = ["mosek"]

[dependency-groups]
dev = ["pytest", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]"]

[tool.uv]
default-groups = ["dev", "docs"]
# exact versions the acceptance tests were proven on; uv.lock must resolve to these
constraint-dependencies = [
    "cvxpy==1.9.3", "clarabel==0.11.1", "osqp==1.1.3", "scs==3.3.2", "numpy==2.5.5", "scipy==1.18.1",
    "pydantic==2.14.4", "pyyaml==6.0.4", "pytest==9.2.0", "ruff==0.17.6", "mkdocs==1.6.1",
    "mkdocstrings==1.0.8", "mkdocstrings-python==2.0.11",
]

[tool.setuptools.dynamic]
version = {attr = "opoise.__version__"}

[tool.setuptools.package-data]
opoise = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["D"]  # keep ruff defaults (E4, E7, E9, F) and add pydocstyle

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
